name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Sanity-builds both board variants on every push/PR — same approach as
  # the tagged release pipeline (release.yml), just without publishing
  # anything. Catches a board-specific compile break (e.g. a missing
  # Kconfig default) long before a tag is pushed.
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: atoms3u
            defaults: sdkconfig.defaults
          - board: geek
            defaults: sdkconfig.defaults;sdkconfig.defaults.geek
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware (${{ matrix.board }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0  # matches the version this project is actually developed/tested against
          target: esp32s3
          path: '.'
          command: idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build

  # CGO-free: the embroidery package + CLI, same as the release pipeline's
  # backend-cli job. Covers catalog_test.go too, not just compilation.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Build
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: go build -v ./cmd/embroidery-backend/... ./embroidery/...
      - name: Vet
        working-directory: backend
        run: go vet ./cmd/embroidery-backend/... ./embroidery/...
      - name: Test
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: go test ./cmd/embroidery-backend/... ./embroidery/...

  # Fyne needs CGo + real GL/X11/Wayland headers — a single-platform sanity
  # build here (release.yml's backend-gui job covers the actual
  # Windows/Linux/macOS release matrix).
  backend-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libgl-dev libegl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Build
        working-directory: backend
        env:
          CGO_ENABLED: '1'
        run: go build -v ./cmd/embroidery-backend-gui/... ./guiapp/...
